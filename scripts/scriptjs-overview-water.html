<script>
    let meters = [];
    let meterWithData = [];
    let locations = [];
    let groups = [];
    let types = [];
    let result = [];
    let lastSelectValueTime = '0';
    let refreshIntervalId;

    let MeterID = 0;
    const typeMeterID = "2"; // Water
    const groupID = "<?=$_SESSION['gid'];?>";

    document.addEventListener("DOMContentLoaded", async () => {
        await fetchAll();

        if (!meters || meters.length === 0) {
            document.getElementById('ov-empty').hidden = false;
            document.getElementById('ov-body').style.display = 'none';
            document.querySelector('.dash-filter-bar').style.display = 'none';
            setInformation();
            return;
        }

        setInformation();
        await generateOption('select-meters', Object.values(meters), true);
        setMeterID();
        updateDetailLink();
        await process();
        await setRefreshTime();
    });

    async function process() {
        meterWithData = await fetchDataOfMeter(MeterID, typeMeterID, groupID, null, timeID = 'filter-lasttime');
        updateData(meterWithData);
        generateDataList();
        updateStatCards(meterWithData);
        await updateSummaryChart();
    }

    /* ── หา type id จากชื่อ (regex) ── */
    function findTypeId(pattern) {
        const found = types.find(t => pattern.test(t.name || ''));
        return found ? String(found.id) : null;
    }

    /* ── การ์ด Flow / Velocity / +Cumulative / -Cumulative (ค่าล่าสุดของมิเตอร์ที่เลือก) ── */
    function updateStatCards(filteredDataInMeters) {
        const selectedMeter = filteredDataInMeters?.[MeterID];
        const dataObj = selectedMeter?.data ?? {};

        const cards = [
            { id: 'wd-stat-flow', typeId: findTypeId(/^flow/i) },
            { id: 'wd-stat-velocity', typeId: findTypeId(/^velocity/i) },
            { id: 'wd-stat-poscum', typeId: findTypeId(/positive.*cumulative/i) },
            { id: 'wd-stat-negcum', typeId: findTypeId(/negative.*cumulative/i) },
        ];

        cards.forEach(c => {
            const el = document.querySelector(`#${c.id} .wd-stat__value`);
            if (!el) return;
            const series = c.typeId ? (dataObj[c.typeId] ?? []) : [];
            const latest = series.length ? series[series.length - 1] : null;
            el.textContent = latest ? Number(latest.value).toLocaleString(undefined, { maximumFractionDigits: 2 }) : (LANG.no_data_for_meter ?? '—');
        });
    }

    /* ── กราฟสรุป: เปรียบเทียบค่าล่าสุดของมิเตอร์น้ำทุกตัวในกลุ่ม (Flow/Velocity/+Cum/-Cum) ── */
    async function updateSummaryChart() {
        const wrap = document.getElementById('chart-summary');
        if (!wrap) return;

        const realtimeMeters = await fetchRealtimeOfMeters(typeMeterID, groupID);
        const meterList = Object.values(realtimeMeters || {});

        if (!meterList.length) {
            wrap.innerHTML = `<p class="ov-nodata"><i class="bi bi-slash-circle"></i> ${LANG.no_data_for_meter ?? 'No data yet'}</p>`;
            return;
        }

        const metrics = [
            { key: 'flow', label: LANG.group_flow, typeId: findTypeId(/^flow/i) },
            { key: 'velocity', label: LANG.group_velocity, typeId: findTypeId(/^velocity/i) },
            { key: 'poscum', label: LANG.positive_cumulative, typeId: findTypeId(/positive.*cumulative/i) },
            { key: 'negcum', label: LANG.negative_cumulative, typeId: findTypeId(/negative.*cumulative/i) },
        ].filter(m => m.typeId);

        const valueByTypeInMeter = (meter, typeId) => {
            const hit = (meter.data || []).find(d => String(d.type_id) === String(typeId));
            const v = hit ? parseFloat(hit.value) : NaN;
            return isFinite(v) ? v : 0;
        };

        _destroyChart('chart-summary');
        wrap.innerHTML = '';
        const canvas = document.createElement('canvas');
        wrap.appendChild(canvas);

        const t = getChartTheme();
        const labels = meterList.map(m => m.name || ('#' + m.id));
        const datasets = metrics.map((m, i) => ({
            label: m.label,
            data: meterList.map(meter => valueByTypeInMeter(meter, m.typeId)),
            backgroundColor: getRandomColor(i) + 'cc',
            borderColor: getRandomColor(i),
            borderWidth: 1,
        }));

        _chartInstances['chart-summary'] = new Chart(canvas, {
            type: 'bar',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: {
                    legend: { display: true, position: 'top', labels: { color: t.legendColor, font: { size: 12 }, boxWidth: 12, usePointStyle: true } },
                    tooltip: { backgroundColor: t.tooltipBg, borderColor: t.tooltipBorder, borderWidth: 1, titleColor: t.textColor, bodyColor: t.mutedColor },
                },
                scales: {
                    x: { ticks: { color: t.mutedColor, font: { size: 11 } }, grid: { display: false }, border: { color: t.gridColor } },
                    y: { ticks: { color: t.mutedColor, font: { size: 11 } }, grid: { color: t.gridColor }, border: { color: t.gridColor } },
                },
            },
        });
    }

    async function fetchAll() {
        let res_location = await fetch("../config/fetch-locations.php");
        let json_location = await res_location.json();
        locations = json_location.data;

        let res_group = await fetch("../config/fetch-groups.php");
        let json_group = await res_group.json();
        groups = json_group.data;

        let responsetype = await fetch("../config/fetch-data_type.php");
        let jsontype = await responsetype.json();
        types = jsontype.data;

        meters = await fetchMeters(typeMeterID, groupID);
    }

    function setInformation() {
        const locate = document.getElementById('location');
        locate.innerHTML = `<?=$lang['location']?> : ` + getNameLocation(groupID);
        const group = document.getElementById('group');
        group.innerHTML = `<?=$lang['group']?> : ` + getNameGroup(groupID);
    }

    async function changeSelectMeter() {
        setMeterID();
        updateDetailLink();
        await process();
        setRefreshTime();
    }

    function updateDetailLink() {
        const link = document.getElementById('link-meter-detail');
        if (link && MeterID) link.href = `meter-detail-water.php?id=${MeterID}`;
    }

    /* ─── Meter info panel (เหมือน dashboard) ─── */
    function generateInfomation(selectMeter) {
        const rows = [
            { label: LANG['metername'], value: selectMeter?.name ?? '—', icon: 'bi-card-text' },
            { label: LANG['status'], value: selectMeter?.is_active, icon: 'bi-phone', isStatus: true },
            { label: LANG['ip_address'], value: selectMeter?.ip_address ?? '—', icon: 'bi-hdd-network' },
            { label: LANG['protocol'], value: selectMeter?.protocol ?? '—', icon: 'bi-modem' },
            { label: LANG['slave_id'], value: selectMeter?.slave_id ?? '—', icon: 'bi-123' },
        ];

        const isDark = document.documentElement.classList.contains('dark');
        const colorValue = isDark ? '#deeacc' : '#1c2214';
        const colorMuted = isDark ? '#607048' : '#7a8f60';
        const colorIcon = isDark ? '#607048' : '#7a8f60';
        const colorBorder = isDark ? '#283820' : '#d8e4c8';

        const cells = rows.map((row, idx) => {
            let valueHtml;
            if (row.isStatus) {
                const isOn = parseInt(row.value) === 1;
                valueHtml = `
                    <span class="info-status-badge ${isOn ? 'info-status--on' : 'info-status--off'}">
                        <span class="info-status-dot"></span>
                        ${isOn ? 'Active' : 'Inactive'}
                    </span>`;
            } else {
                valueHtml = `<div class="info-vstack-value" style="color:${colorValue} !important;font-size:13px;font-weight:600;line-height:1.3;">${row.value}</div>`;
            }
            const divider = idx < rows.length - 1
                ? `<div class="info-vstack-divider" style="height:1px;background:${colorBorder};margin:0 14px;"></div>`
                : '';
            return `
                <div class="info-vstack-item" style="display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 14px;">
                    <div style="display:flex;align-items:center;gap:6px;">
                        <i class="bi ${row.icon}" style="font-size:13px;color:${colorIcon} !important;"></i>
                        <div class="info-vstack-label" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:${colorMuted} !important;">${row.label}</div>
                    </div>
                    ${valueHtml}
                </div>${divider}`;
        }).join('');

        const wrapper = document.createElement('div');
        wrapper.className = 'info-vstack-list';
        Object.assign(wrapper.style, { display: 'flex', flexDirection: 'column', width: '100%', boxSizing: 'border-box', padding: '4px 0' });
        wrapper.innerHTML = cells;
        document.getElementById('infomation').innerHTML = '';
        document.getElementById('infomation').appendChild(wrapper);
    }

    /* ─── Type-of-value list: ไม่ล็อกตายตัวเป็นไฟฟ้า — สร้างจาก data_type จริง ที่มีข้อมูลของมิเตอร์นี้ ─── */
    function generateDataList() {
        const listdata = document.getElementById('list-data');
        listdata.innerHTML = '';
        Object.assign(listdata.style, { display: 'block', width: '100%', boxSizing: 'border-box', padding: '0' });

        const selectedMeter = meterWithData[MeterID];
        const dataObj = selectedMeter?.data ?? {};

        const availableTypes = types.filter(t => (dataObj[t.id] ?? []).length > 0);

        if (availableTypes.length === 0) {
            listdata.innerHTML = `<p class="ov-nodata"><i class="bi bi-slash-circle"></i> ${LANG.no_data_for_meter ?? 'No data yet'}</p>`;
            return;
        }

        const gridDiv = document.createElement('div');
        gridDiv.className = 'tov-grid tov-grid--3';
        Object.assign(gridDiv.style, { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '5px', marginBottom: '6px', width: '100%', boxSizing: 'border-box' });

        availableTypes.forEach(t => {
            gridDiv.appendChild(buildTovButton({ id: String(t.id), name: t.name }));
        });

        listdata.appendChild(gridDiv);
    }

    function buildTovButton(cfg) {
        const isActive = result.includes(cfg.id);
        const btn = document.createElement('button');
        btn.setAttribute('data-id', cfg.id);
        btn.className = 'tov-btn' + (isActive ? ' active' : '');

        Object.assign(btn.style, {
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            gap: '4px', padding: '7px 4px 6px', borderRadius: '8px',
            border: isActive ? '1.5px solid var(--green)' : '1.5px solid var(--border)',
            background: isActive ? 'var(--green-light)' : 'var(--bg-card)',
            cursor: 'pointer', minHeight: '54px', width: '100%', boxSizing: 'border-box', margin: '0',
        });

        const iconDiv = document.createElement('div');
        iconDiv.className = 'tov-icon';
        Object.assign(iconDiv.style, {
            width: '26px', height: '26px', minWidth: '26px', borderRadius: '6px',
            background: isActive ? 'rgba(139,174,102,0.25)' : 'var(--bg-select)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: '0',
        });
        const icon = document.createElement('i');
        icon.className = 'bi bi-droplet-half';
        Object.assign(icon.style, { fontSize: '12px', lineHeight: '1', color: isActive ? 'var(--green)' : 'var(--text-muted)' });
        iconDiv.appendChild(icon);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'tov-name';
        nameSpan.textContent = cfg.name;
        Object.assign(nameSpan.style, { fontSize: '11px', fontWeight: '700', color: isActive ? 'var(--green-dark)' : 'var(--text-primary)', textAlign: 'center', lineHeight: '1.1' });

        btn.appendChild(iconDiv);
        btn.appendChild(nameSpan);

        btn.addEventListener('click', function () {
            const id = cfg.id;
            if (result.includes(id)) {
                result = result.filter(item => item !== id);
            } else {
                result.push(id);
            }
            generateDataList();
            updateData(meterWithData);
        });

        return btn;
    }

    function setRefreshTime() {
        const inputRefresh = document.getElementById('input-refresh');
        const refreshTime = parseInt(inputRefresh.value, 10);
        if (isNaN(refreshTime) || refreshTime < 1 || refreshTime > 30) return;
        clearInterval(refreshIntervalId);
        refreshIntervalId = setInterval(() => { process(); }, refreshTime * 1000);
    }

    /* ======== Chart.js helpers ======== */
    function getCssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

    function getRandomColor(index) {
        const isDark = document.documentElement.classList.contains('dark');
        const colors = isDark ? [
            "#8BAE66", "#A8C87A", "#6e9248", "#C2DC9A", "#5a7a3a",
            "#B5D488", "#7FA055", "#D4EBB0", "#4d6832", "#9BC070",
        ] : [
            "#6e9248", "#8BAE66", "#4d6832", "#A8C87A", "#3d5628",
            "#7FA055", "#527838", "#B5D488", "#638C40", "#5a7a3a",
        ];
        return colors[index % colors.length];
    }

    function getChartTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        return {
            bgColor: getCssVar('--bg-card'), textColor: getCssVar('--text-primary'),
            mutedColor: getCssVar('--text-muted'), gridColor: getCssVar('--border'),
            tooltipBg: isDark ? getCssVar('--bg-select') : '#ffffff',
            tooltipBorder: getCssVar('--green'), legendColor: getCssVar('--text-secondary'),
        };
    }

    function formatDate(d) {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const pad = n => String(n).padStart(2, '0');
        return `${pad(d.getDate())} ${months[d.getMonth()]} ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    const _chartInstances = {};
    function _destroyChart(id) { if (_chartInstances[id]) { _chartInstances[id].destroy(); delete _chartInstances[id]; } }
    function _getCanvas(containerId) {
        const wrap = document.getElementById(containerId);
        wrap.innerHTML = '';
        const canvas = document.createElement('canvas');
        wrap.appendChild(canvas);
        return canvas;
    }

    function prepareLinearData(SelectedFilterMeter, columnIndex) {
        const rawData = SelectedFilterMeter?.data?.[columnIndex];
        if (!rawData || !Array.isArray(rawData) || rawData.length === 0) return null;
        return {
            label: getLabelFromIndex(columnIndex),
            data: rawData.map(row => ({ x: new Date(row.create_date.replace(' ', 'T')), y: parseFloat(row.value) || 0 })),
            color: getRandomColor(columnIndex)
        };
    }

    function getLabelFromIndex(index) {
        const found = types.find(r => r['id'] == index);
        return found ? found['name'] : 'unknown';
    }

    async function updateData(filteredDataInMeters) {
        const selectedMeter = filteredDataInMeters?.[MeterID];

        if (lastSelectValueTime !== MeterID) {
            lastSelectValueTime = MeterID;
        }

        generateInfomation(selectedMeter);

        // เลือก type แรกที่มีข้อมูลจริงเป็นค่าเริ่มต้น ถ้ายังไม่ได้เลือกอะไรเลย
        if (result.length === 0 && selectedMeter?.data) {
            const firstWithData = types.find(t => (selectedMeter.data[t.id] ?? []).length > 0);
            if (firstWithData) result = [String(firstWithData.id)];
        }

        const lineDatasets = result.map(index => prepareLinearData(selectedMeter, index)).filter(Boolean);
        createLinearChart('chart-linear', '', lineDatasets);
    }

    function createLinearChart(containerId, title, datasets) {
        const t = getChartTheme();
        _destroyChart(containerId);
        const wrap = document.getElementById(containerId);

        if (!datasets || datasets.length === 0) {
            wrap.innerHTML = `<p class="ov-nodata"><i class="bi bi-slash-circle"></i> ${LANG.no_data_for_meter ?? 'No data yet'}</p>`;
            return;
        }

        const canvas = _getCanvas(containerId);
        const chartDatasets = datasets.map(ds => ({
            label: ds.label, data: ds.data, borderColor: ds.color, backgroundColor: ds.color + '22',
            borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.3, fill: false,
        }));

        _chartInstances[containerId] = new Chart(canvas, {
            type: 'line',
            data: { datasets: chartDatasets },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: true, position: 'top', labels: { color: t.legendColor, font: { size: 12 }, boxWidth: 12, padding: 12, usePointStyle: true } },
                    tooltip: {
                        backgroundColor: t.tooltipBg, borderColor: t.tooltipBorder, borderWidth: 1,
                        titleColor: t.textColor, bodyColor: t.mutedColor,
                        titleFont: { weight: 'bold', size: 12 }, bodyFont: { size: 12 }, padding: 10,
                        callbacks: {
                            title: items => formatDate(new Date(items[0].parsed.x)),
                            label: item => ` ${item.dataset.label}: ${item.parsed.y.toLocaleString(undefined, { maximumFractionDigits: 2 })}`
                        }
                    },
                },
                scales: {
                    x: {
                        type: 'time',
                        time: { tooltipFormat: 'dd MMM yyyy HH:mm:ss', displayFormats: { minute: 'HH:mm', hour: 'HH:mm', day: 'dd MMM' } },
                        ticks: { color: t.mutedColor, font: { size: 11 }, maxRotation: 0 },
                        grid: { color: t.gridColor }, border: { color: t.gridColor },
                    },
                    y: { ticks: { color: t.mutedColor, font: { size: 11 } }, grid: { color: t.gridColor }, border: { color: t.gridColor } }
                }
            }
        });
    }
</script>
