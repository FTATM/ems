<script>

    /* ── Lang ── */
    const _lang = JSON.parse(document.getElementById('lang-data').textContent);

    /* ── Modal Notification System ── */
    (function () {
        const css = `
        /* ── Overlay ── */
        #ems-modal-overlay {
            position: fixed; inset: 0; z-index: 99990;
            background: rgba(0,0,0,.45);
            backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.22s ease;
        }

        /* ── Card ── */

            position: relative;

            background: var(--bg-card, #fff);
            border-radius: 18px;

            overflow: hidden;
            transform: scale(0.88) translateY(16px);
            transition: transform 0.25s cubic-bezier(.34,1.45,.64,1), opacity 0.22s ease;
            opacity: 0;
        }
        #ems-modal-overlay.show #ems-modal-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        /* ── Accent bar ── */
        #ems-modal-card::before {
            content: '';
            display: block;
            height: 5px;
            width: 100%;
        }
        #ems-modal-card.mod-success::before { background: linear-gradient(90deg,#a8c97a,#8BAE66); }
        #ems-modal-card.mod-blue::before    { background: linear-gradient(90deg,#60a5fa,#3b82f6); }
        #ems-modal-card.mod-error::before   { background: linear-gradient(90deg,#f87171,#ef4444); }
        #ems-modal-card.mod-info::before    { background: linear-gradient(90deg,#60a5fa,#3b82f6); }

        /* ── Inner padding ── */
        .ems-modal-body {
            padding: 1.6rem 1.75rem 1.4rem;
            display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
            text-align: center;
        }

        /* ── Icon circle ── */
        .ems-modal-icon-wrap {
            width: 68px; height: 68px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            margin-bottom: 0.25rem;
        }
        #ems-modal-card.mod-success .ems-modal-icon-wrap { background: rgba(139,174,102,.15); color: #2d4416; border: 2px solid rgba(139,174,102,.40); }
        #ems-modal-card.mod-blue    .ems-modal-icon-wrap { background: rgba(59,130,246,.13);  color: #1d4ed8; border: 2px solid rgba(59,130,246,.35);  }
        #ems-modal-card.mod-error   .ems-modal-icon-wrap { background: rgba(248,113,113,.14); color: #dc2626; border: 2px solid rgba(248,113,113,.35); }
        #ems-modal-card.mod-info    .ems-modal-icon-wrap { background: rgba(96,165,250,.14);  color: #2563eb; border: 2px solid rgba(96,165,250,.35);  }
        #ems-modal-card.mod-warning .ems-modal-icon-wrap { background: rgba(251,191,36,.14);  color: #d97706; border: 2px solid rgba(251,191,36,.35);  }

        /* ── Title ── */
        .ems-modal-title {
            font-size: 1.08rem; font-weight: 700;
            color: var(--text-heading, #1a2e14);
            line-height: 1.3; margin: 0;
        }

        /* ── Description ── */
        .ems-modal-desc {
            font-size: 0.88rem;
            color: var(--text-muted, #6b7280);
            line-height: 1.55; margin: 0;
            max-width: 320px;
        }

        /* ── Action label badge ── */
        .ems-modal-action-badge {
            display: inline-flex; align-items: center; gap: 0.35rem;
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.75rem; font-weight: 700;
            letter-spacing: 0.04em; text-transform: uppercase;
        }
        #ems-modal-card.mod-success .ems-modal-action-badge { background: rgba(139,174,102,.13); color: #2d4416; border: 1px solid rgba(139,174,102,.40); }
        #ems-modal-card.mod-blue    .ems-modal-action-badge { background: rgba(59,130,246,.11);  color: #1d4ed8; border: 1px solid rgba(59,130,246,.35);  }
        #ems-modal-card.mod-error   .ems-modal-action-badge { background: rgba(248,113,113,.12); color: #b91c1c; border: 1px solid rgba(248,113,113,.35); }
        #ems-modal-card.mod-info    .ems-modal-action-badge { background: rgba(96,165,250,.12);  color: #1d4ed8; border: 1px solid rgba(96,165,250,.35);  }
        #ems-modal-card.mod-warning .ems-modal-action-badge { background: rgba(251,191,36,.12);  color: #b45309; border: 1px solid rgba(251,191,36,.35);  }

        /* ── Footer ── */
        .ems-modal-footer {
            padding: 0.9rem 1.75rem 1.3rem;
            display: flex; justify-content: center;
        }

        /* ── Close button ── */
        #ems-modal-close-btn {
            min-width: 120px;
            padding: 0.52rem 1.5rem;
            border: none; border-radius: 10px;
            font-size: 0.9rem; font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        #ems-modal-close-btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
        #ems-modal-card.mod-success #ems-modal-close-btn { background: #8BAE66; color: #fff; }
        #ems-modal-card.mod-blue    #ems-modal-close-btn { background: #3b82f6; color: #fff; }
        #ems-modal-card.mod-error   #ems-modal-close-btn { background: #ef4444; color: #fff; }
        #ems-modal-card.mod-info    #ems-modal-close-btn { background: #3b82f6; color: #fff; }
        #ems-modal-card.mod-warning #ems-modal-close-btn { background: #f59e0b; color: #fff; }

        /* ── X close icon (top-right) ── */
        #ems-modal-x {
            position: absolute; top: 0.75rem; right: 0.85rem;
            width: 28px; height: 28px;
            border-radius: 50%; border: none; background: transparent;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted, #9ca3af);
            font-size: 1.1rem; line-height: 1;
            transition: background 0.15s ease, color 0.15s ease;
        }
        #ems-modal-x:hover { background: var(--border, #e5e7eb); color: var(--text-body, #374151); }

        /* ── Auto-close progress bar ── */
        .ems-modal-progress {
            height: 3px;
            background: linear-gradient(90deg, var(--primary,#8BAE66), transparent);
            transform-origin: left;
            animation: modalProgress linear forwards;
        }
        @keyframes modalProgress { from { transform: scaleX(1); } to { transform: scaleX(0); } }

        /* ── Decorative circles (subtle, like notallow page style) ── */
        .ems-modal-deco {
            position: absolute; border-radius: 50%; pointer-events: none;
        }
        `;
        const st = document.createElement('style');
        st.textContent = css;
        document.head.appendChild(st);

        // Build DOM
        const overlay = document.createElement('div');
        overlay.id = 'ems-modal-overlay';
        overlay.innerHTML = `
            <div id="ems-modal-card">
                <button id="ems-modal-x" onclick="closeEmsModal()" aria-label="Close">&#x2715;</button>
                <div id="ems-modal-progress-wrap"></div>
                <div class="ems-modal-body">
                    <div class="ems-modal-icon-wrap" id="ems-modal-icon"></div>
                    <div class="ems-modal-action-badge" id="ems-modal-badge"></div>
                    <p class="ems-modal-title" id="ems-modal-title"></p>
                    <p class="ems-modal-desc"  id="ems-modal-desc"></p>
                </div>
                <div class="ems-modal-footer">
                    <button id="ems-modal-close-btn" onclick="closeEmsModal()">${_lang['ok']}</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeEmsModal(); });
    })();

    let _emsModalTimer = null;

    /* ── SVG icons per type ── */
    const _emsIcons = {
        success: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
        error:   `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
        blue:    `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><circle cx="12" cy="3" r="1" fill="currentColor" stroke="none"/></svg>`,
        info:    `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
        warning: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    };

    /* ── Action badge labels ── */
    const _emsBadgeLabels = {
        save:     (_lang['badge_save']    || 'บันทึกข้อมูล'),
        update:   (_lang['badge_update']  || 'อัพเดต'),
        create:   (_lang['badge_create']  || 'สร้างใหม่'),
        delete:   (_lang['badge_delete']  || 'ลบ'),
        enable:   (_lang['badge_enable']  || 'เปิดการแจ้งเตือน'),
        disable:  (_lang['badge_disable'] || 'ปิดการแจ้งเตือน'),
        connect:  (_lang['badge_connect'] || 'ทดสอบการเชื่อมต่อ'),
        error:    (_lang['badge_error']   || 'เกิดข้อผิดพลาด'),
    };

    function showEmsModal(type, action, title, desc, autoDuration = 3500) {
        const overlay = document.getElementById('ems-modal-overlay');
        const card    = document.getElementById('ems-modal-card');
        if (!overlay || !card) return;

        // Reset type class
        card.className = 'mod-' + type;

        // Always restore footer (may have been replaced by showEmsConfirm)
        const footer = overlay.querySelector(".ems-modal-footer");
        if (footer && !document.getElementById("ems-modal-close-btn")) {
            footer.innerHTML = `<button id="ems-modal-close-btn" onclick="closeEmsModal()">${_lang['ok']}</button>`;
        }

        // Populate
        document.getElementById('ems-modal-icon').innerHTML  = _emsIcons[type] || _emsIcons.info;
        document.getElementById('ems-modal-badge').textContent = _emsBadgeLabels[action] || action;
        document.getElementById('ems-modal-title').textContent = title;
        document.getElementById('ems-modal-desc').textContent  = desc;

        // Progress bar
        const pw = document.getElementById('ems-modal-progress-wrap');
        pw.innerHTML = '';
        if (autoDuration > 0) {
            const bar = document.createElement('div');
            bar.className = 'ems-modal-progress';
            bar.style.animationDuration = autoDuration + 'ms';
            pw.appendChild(bar);
        }

        // Show
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';

        // Clear old timer
        if (_emsModalTimer) { clearTimeout(_emsModalTimer); _emsModalTimer = null; }
        if (autoDuration > 0) {
            _emsModalTimer = setTimeout(closeEmsModal, autoDuration);
        }
    }

    function closeEmsModal() {
        const overlay = document.getElementById('ems-modal-overlay');
        if (!overlay) return;
        overlay.classList.remove('show');
        document.body.style.overflow = '';
        if (_emsModalTimer) { clearTimeout(_emsModalTimer); _emsModalTimer = null; }
    }

    /**
     * showEmsConfirm — confirm dialog with Cancel / Confirm buttons
     * @param {string}   title      - headline
     * @param {string}   desc       - sub description
     * @param {Function} onConfirm  - callback when user presses Confirm
     */
    function showEmsConfirm(title, desc, onConfirm) {
        const overlay = document.getElementById('ems-modal-overlay');
        const card    = document.getElementById('ems-modal-card');
        if (!overlay || !card) return;

        card.className = 'mod-warning';

        document.getElementById('ems-modal-icon').innerHTML    = _emsIcons.warning;
        document.getElementById('ems-modal-badge').textContent = _emsBadgeLabels.delete;
        document.getElementById('ems-modal-title').textContent  = title;
        document.getElementById('ems-modal-desc').textContent   = desc;

        document.getElementById('ems-modal-progress-wrap').innerHTML = '';

        // Replace footer with Cancel + Confirm
        const footer = overlay.querySelector('.ems-modal-footer');
        footer.innerHTML = `
            <button onclick="closeEmsModal()" style="
                min-width:110px; padding:0.52rem 1.2rem; border:1.5px solid var(--border,#e5e7eb);
                border-radius:10px; font-size:0.9rem; font-weight:600; cursor:pointer;
                background:transparent; color:var(--text-body,#374151);
                transition:background 0.15s ease; margin-right:0.6rem;
            " onmouseover="this.style.background='var(--border,#e5e7eb)'" onmouseout="this.style.background='transparent'">
                ${_lang['cancel']}
            </button>
            <button id="ems-confirm-ok-btn" style="
                min-width:110px; padding:0.52rem 1.2rem; border:none;
                border-radius:10px; font-size:0.9rem; font-weight:700; cursor:pointer;
                background:#ef4444; color:#fff;
                transition:filter 0.15s ease;
            " onmouseover="this.style.filter='brightness(1.1)'" onmouseout="this.style.filter='brightness(1)'">
                ${_lang['confirm_delete']}
            </button>
        `;

        document.getElementById('ems-confirm-ok-btn').onclick = () => {
            // Restore normal footer for next use
            footer.innerHTML = `<button id="ems-modal-close-btn" onclick="closeEmsModal()">${_lang['ok']}</button>`;
            closeEmsModal();
            if (typeof onConfirm === 'function') onConfirm();
        };

        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    /* ── Backward-compat shim so old showToast() calls still work ── */
    function showToast(type, message, duration = 2800) {
        const actionMap = { success: 'update', error: 'error', info: 'connect', blue: 'enable' };
        const titleMap  = {
            success: 'สำเร็จ',
            error:   'เกิดข้อผิดพลาด',
            info:    'ข้อมูล',
            blue:    'แจ้งเตือน',
        };
        showEmsModal(type, actionMap[type] || 'update', titleMap[type] || '', message, duration);
    }

    let meters = [];
    let groups = [];
    let selected_meter = [];
    let types = [];
    let notifies = [];
    let outputText = '';
    document.addEventListener("DOMContentLoaded", async () => {
        process();
    });
    async function process() {
        //showLoading();
        await fetchAll();
        generateMeter(meters);
        //hideLoading();
    }

    async function fetchAll() {
        meters = await fetchMetersData();
        groups = await fetchGroups();
        types = await fetchTypes();
        notifies = await fetchnotify();

        console.log(meters);

    }
    async function fetchMetersData() {
        let response = await fetch("../config/fetch-meters.php");
        let json = await response.json();
        return Object.values(json.data);
    }
    async function fetchGroups() {
        let response = await fetch("../config/fetch-groups.php");
        let json = await response.json();
        return json.data || [];
    }
    async function fetchTypes() {
        let response = await fetch("../config/fetch-data_type.php");
        let json = await response.json();
        return json.data;
    }
    async function fetchnotify() {
        let response = await fetch("../config/fetch-notify.php");
        let json = await response.json();
        return json.data;
    }

    async function TestConnect() {
        let select = document.getElementById("select-protocol");
        let id = document.getElementById("meter-id");
        let ip = document.getElementById("ip-meter");
        let port = document.getElementById("port");
        let serialport = document.getElementById("serialport");
        let buad_rate = document.getElementById("buad_rate");
        let data_bits = document.getElementById("data_bits");
        let parity = document.getElementById("parity");
        let stop_bits = document.getElementById("stop_bits");
        let slave_id = document.getElementById("slave_id");
        let address = document.getElementById("address");
        let quality = document.getElementById("quality");
        let labelStatusConnect = document.getElementById("label-btn-connect");
        let detailmore = document.getElementById("detailmore");
        detailmore.style.display = "block";
        labelStatusConnect.textContent = "Loading...";
        labelStatusConnect.style.color = "white";

        let form = new FormData();
        if (select.value === 'tcp') {
            form.append('meter_id', id.value);
            form.append('ip', ip.value);
            form.append('port', port.value);
            form.append('quality', quality.value);
            form.append('slaveid', slave_id.value);
        }
        else {
            form.append('meter_id', id.value);
            form.append('serialport', serialport.value);
            form.append('buadrate', buad_rate.value);
            form.append('databits', data_bits.value);
            form.append('parity', parity.value);
            form.append('stopbits', stop_bits.value);
            form.append('slaveid', slave_id.value);
            form.append('address', address.value);
            form.append('quality', quality.value);
        }
        let response = await fetch(`../config/${select.value}.php`, {
            method: "POST",
            body: form
        });

        let json = await response.json();
        outputText = json.message + "\n" + json.output;
        labelStatusConnect.textContent = json.success ? "Connected" : "Failed";
        labelStatusConnect.style.color = json.success ? "green" : "red";

        if (json.success) {
            showEmsModal('success', 'connect',
                _lang['connect_success']      || 'เชื่อมต่อสำเร็จ',
                (_lang['connect_success_desc'] || 'Meter เชื่อมต่อได้ปกติ กรุณากดปุ่ม') + ' ' + _lang['save'] + ' ' + (_lang['connect_success_desc2'] || 'เพื่อบันทึก'), 4000);
        } else {
            showEmsModal('error', 'connect',
                _lang['connect_failed']      || 'เชื่อมต่อไม่สำเร็จ',
                json.message || _lang['connect_failed_desc'] || 'ไม่สามารถเชื่อมต่อกับ Meter ได้ กรุณาตรวจสอบการตั้งค่า', 5000);
        }
    }

    function generateMeter(meters) {
        let list = document.getElementById('meter-list');
        list.innerHTML = '';
        meters.forEach(meter => {
            const proto = (meter.protocol === 'rs485') ? 'rs485' : 'tcp';
            const on = Number(meter.is_active) === 1;

            let row = document.createElement('div');
            row.className = 'meter-row';
            row.dataset.name = (meter.name || '').toLowerCase();
            row.dataset.id = meter.id;
            row.innerHTML = `
                <span class="status-dot status-dot--${on ? 'on' : 'off'}"></span>
                <span class="meter-row__name">${meter.name}</span>
                <span class="badge-proto badge-proto--${proto}">${proto === 'rs485' ? 'RS485' : 'TCP'}</span>
            `;
            row.onclick = () => {
                document.querySelectorAll('#meter-list .meter-row.is-selected')
                    .forEach(el => el.classList.remove('is-selected'));
                row.classList.add('is-selected');
                loadDataMeter(meter);
            };
            list.appendChild(row);
        });
        filterMeterList();
    }

    function filterMeterList() {
        const box = document.getElementById('meter-search');
        const term = (box ? box.value : '').trim().toLowerCase();
        document.querySelectorAll('#meter-list .meter-row').forEach(row => {
            row.hidden = term !== '' && !row.dataset.name.includes(term);
        });
    }

    async function loadDataMeter(meter) {

            selected_meter = meter;
            let config = document.getElementById('config');
            if (document.getElementById("menu-config-1").classList.contains("active")) {
                const groupOpts = (groups || []).map(g =>
                    `<option value="${g.id}" ${String(g.id) === String(meter.group_id) ? 'selected' : ''}>${g.name}</option>`
                ).join('');

                config.innerHTML = `
            <div class="mcfg-section">
                <p class="mcfg-section__title">${_lang['section_general'] || 'General'}</p>
                <div class="mcfg-grid">
                    <div class="mcfg-field">
                        <label>Meter ID</label>
                        <input value='${meter.id}' disabled>
                        <input id="meter-id" name="id" type="hidden" value='${meter.id}'>
                    </div>
                    <div class="mcfg-field">
                        <label>${_lang['meter_name'] || 'Meter name'}</label>
                        <input name="name" value='${meter.name ?? ''}'>
                    </div>
                    <div class="mcfg-field">
                        <label>${_lang['group'] || 'Group'}</label>
                        <select name="group_id">${groupOpts}</select>
                    </div>
                    <div class="mcfg-field mcfg-field--check">
                        <input id="meter-active" name="is_active" type="checkbox" ${Number(meter.is_active) === 1 ? 'checked' : ''}>
                        <label for="meter-active">${_lang['active'] || 'Active'}</label>
                    </div>
                </div>
            </div>

            <div class="mcfg-section">
                <p class="mcfg-section__title">${_lang['section_position'] || '3D Position'}</p>
                <div class="mcfg-grid mcfg-grid--3">
                    <div class="mcfg-field"><label>X</label><input name="x" type="number" value="${meter.x ?? ''}"></div>
                    <div class="mcfg-field"><label>Y</label><input name="y" type="number" value="${meter.y ?? ''}"></div>
                    <div class="mcfg-field"><label>Z</label><input name="z" type="number" value="${meter.z ?? ''}"></div>
                </div>
            </div>

            <div class="mcfg-section">
                <p class="mcfg-section__title">${_lang['section_connection'] || 'Connection'}</p>
                <div class="mcfg-grid">
                    <div class="mcfg-field">
                        <label>Protocol</label>
                        <select id="select-protocol" name="select_protocol" onchange="switchProtocolFields()">
                            <option value="tcp" ${meter.protocol === 'tcp' ? 'selected' : ''}>TCP</option>
                            <option value="rs485" ${meter.protocol === 'rs485' ? 'selected' : ''}>RS485</option>
                        </select>
                    </div>
                </div>

                <div id="conn-tcp" class="mcfg-grid" style="margin-top:.85rem">
                    <div class="mcfg-field"><label>DNS</label><input name="dns" value="${meter.dns ?? ''}"></div>
                    <div class="mcfg-field"><label>Port</label><input id="port" name="port" type="number" value="${meter.port ?? ''}"></div>
                    <div class="mcfg-field"><label>IP Address</label><input id="ip-meter" name="ip" value="${meter.ip_address ?? ''}"></div>
                    <div class="mcfg-field"><label>Submask</label><input name="submask" value="${meter.submask ?? ''}"></div>
                </div>

                <div id="conn-rs485" class="mcfg-grid" style="margin-top:.85rem">
                    <div class="mcfg-field"><label>Serial Port</label><input id="serialport" name="serialport" value="${meter.serial_port ?? ''}"></div>
                    <div class="mcfg-field"><label>Baud Rate</label><input id="buad_rate" name="buad_rate" value="${meter.buad_rate ?? ''}"></div>
                    <div class="mcfg-field"><label>Data Bits</label><input id="data_bits" name="data_bits" type="number" value="${meter.data_bits ?? ''}"></div>
                    <div class="mcfg-field"><label>Parity</label><input id="parity" name="parily" value="${meter.parily ?? ''}"></div>
                    <div class="mcfg-field"><label>Stop Bits</label><input id="stop_bits" name="stop_bits" type="number" value="${meter.stop_bits ?? ''}"></div>
                    <div class="mcfg-field"><label>Address</label><input id="address" name="address" value="${meter.address ?? ''}"></div>
                </div>

                <div class="mcfg-grid" style="margin-top:.85rem">
                    <div class="mcfg-field"><label>${_lang['slave_id'] || 'Slave ID'}</label><input id="slave_id" name="slave_id" type="number" value="${meter.slave_id ?? ''}"></div>
                    <div class="mcfg-field"><label>Quality</label><input id="quality" name="quality" type="number" value="${meter.quality ?? ''}"></div>
                </div>
            </div>

            <div class="mcfg-section">
                <p class="mcfg-section__title">${_lang['section_test'] || 'Test connection'}</p>
                <input id="btn-connect" class="btn btn-sm btn-primary" value="Connect" onclick="TestConnect()">
                <label id="label-btn-connect" class="mx-3" for="btn-connect"></label>
                <div id="detailmore" style="display:none;" class="clickable" onclick="openDetail()">Detail more...</div>
            </div>

            <div class="mcfg-footer">
                <button type="button" onclick="loadDataMeter(selected_meter)" class="mcfg-btn mcfg-btn--cancel">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    ${_lang['cancel']}
                </button>
                <button type="button" id="btn-save-meter" onclick="updateMeter()" class="mcfg-btn mcfg-btn--save">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    ${_lang['save']}
                </button>
            </div>
        `;
                switchProtocolFields();
            }
            else if (document.getElementById("menu-config-2").classList.contains("active")) {
                config.innerHTML = '';
                let mother = document.createElement('div');
                mother.id = "list-notify";
                mother.className = 'w-100 h-100 d-flex';
                let notiData = notifies.filter(notify => notify.meter_id == meter.id);
                notiData.forEach(row => {
                    let div = document.createElement('div');
                    div.className = 'noti-card';
                    div.innerHTML = `
                        <div class="noti-card__head">
                            <svg class="noti-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                            <span class="noti-card__title" title="${row.name}">${row.name}</span>
                            <button type="button" class="noti-card__del" onclick="deleteNotify(${meter.id},${row.id})" aria-label="delete">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </div>
                        <div class="noti-card__body">
                            <input id="meter-${row.id}" type="hidden" value="${row.meter_id}"/>
                            <input id="name-${row.id}" type="hidden" value="${row.name}"/>

                            <label class="noti-label">${_lang['sign']}</label>
                            <div class="noti-cond">
                                <select id="select-mark-${row.id}" class="noti-input">
                                    <option ${row.mark == '<' ? 'selected' : ''} value="<">${_lang['<']} (&lt;)</option>
                                    <option ${row.mark == '>' ? 'selected' : ''} value=">">${_lang['>']} (&gt;)</option>
                                    <option ${row.mark == '=' ? 'selected' : ''} value="=">${_lang['=']} (=)</option>
                                </select>
                                <input id="value-${row.id}" class="noti-input" type="number" value="${row.value_condition}" placeholder="${_lang['value']}">
                            </div>

                            <label class="noti-label">${_lang['token']} ${_lang['line']}</label>
                            <input id="token-${row.id}" class="noti-input" type="text" value="${row.token_line}" placeholder="Line token">

                            <label class="noti-label">${_lang['email']}</label>
                            <input id="email-${row.id}" class="noti-input" type="text" value="${row.email}" placeholder="email">

                            <div class="noti-actions">
                                <input id="active-${row.id}" onclick="UpdateStatusNotify(${meter.id},${row.id},'active')" value="${row.is_active == 1 ? _lang['enabled'] : _lang['disabled']}" class="noti-btn ${row.is_active == 1 ? 'bg-blue' : 'bg-red'}" readonly>
                                <input id="update-${row.id}" onclick="UpdateStatusNotify(${meter.id},${row.id},'update')" value="${_lang['update']}" class="noti-btn bg-green" readonly>
                            </div>
                        </div>
                    `;
                    mother.appendChild(div);
                });
                let blankdiv = document.createElement('div');
                blankdiv.className = "noti-card--add";
                blankdiv.id = "blankdiv";
                blankdiv.innerHTML = `
                    <div onclick="addNotify()">
                        <input id="meterID" value="${meter.id}" type="hidden" />
                        <i class="bi bi-plus-lg"></i>
                    </div>
                `;
                mother.appendChild(blankdiv);
                config.appendChild(mother);
            }
        }
    }

    function switchProtocolFields() {
        const sel = document.getElementById('select-protocol');
        if (!sel) return;
        const p = sel.value;
        const tcp = document.getElementById('conn-tcp');
        const rs485 = document.getElementById('conn-rs485');
        if (tcp) tcp.hidden = (p !== 'tcp');
        if (rs485) rs485.hidden = (p !== 'rs485');
    }

    function openDetail() {
        showEmsModal('info', 'connect', _lang['detail_more'] || 'Connection detail', outputText, 0);
    }

    async function UpdateStatusNotify(meter_id, notify_id, status) {
        let formdata = new FormData();
        formdata.append('id', notify_id);
        formdata.append('status', status);

        // ── Toggle active/disabled ──────────────────────────────────────
        if (status === 'active') {
            const btn = document.getElementById('active-' + notify_id);
            const wasActive = btn.classList.contains('bg-blue'); // true = กำลัง enabled อยู่

            // สลับปุ่มทันที
            if (wasActive) {
                btn.classList.remove('bg-blue'); btn.classList.add('bg-red');
                btn.value = _lang['disabled'];
            } else {
                btn.classList.remove('bg-red'); btn.classList.add('bg-blue');
                btn.value = _lang['enabled'];
            }

            formdata.append('value', wasActive ? 1 : 0); // ส่งค่าเดิม (server จะ flip)

            showLoading();
            try {
                const res  = await fetch('../config/update-notify.php', { method: 'POST', body: formdata });
                const data = await res.json();
                if (data.success) {
                    notifies = await fetchnotify();
                    showEmsModal(wasActive ? 'error' : 'blue',
                        wasActive ? 'disable' : 'enable',
                        wasActive ? (_lang['notify_disabled_title'] || 'ปิดการแจ้งเตือนแล้ว')   : (_lang['notify_enabled_title'] || 'เปิดการแจ้งเตือนแล้ว'),
                        wasActive ? (_lang['notify_disabled_desc']  || 'การแจ้งเตือนนี้ถูกปิดใช้งานเรียบร้อยแล้ว') : (_lang['notify_enabled_desc'] || 'การแจ้งเตือนนี้ถูกเปิดใช้งานเรียบร้อยแล้ว'));
                } else {
                    // Revert กลับถ้า API ล้มเหลว
                    if (wasActive) {
                        btn.classList.remove('bg-red'); btn.classList.add('bg-blue'); btn.value = _lang['enabled'];
                    } else {
                        btn.classList.remove('bg-blue'); btn.classList.add('bg-red'); btn.value = _lang['disabled'];
                    }
                    showEmsModal('error', 'error',
                        _lang['save_failed'] || 'ไม่สามารถบันทึกได้',
                        data.message || _lang['status_change_error'] || 'เกิดข้อผิดพลาดในการเปลี่ยนสถานะ กรุณาลองอีกครั้ง');
                }
            } catch(e) { showEmsModal('error', 'error', _lang['error'] || 'เกิดข้อผิดพลาด', e.message); }
            hideLoading();
            return;
        }

        // ── Update / Create ──────────────────────────────────────────────
        if (status === 'update' || status === 'create') {
            const select = document.getElementById('select-mark-' + notify_id);
            const name   = document.getElementById('name-'        + notify_id);
            const value  = document.getElementById('value-'       + notify_id);
            const token  = document.getElementById('token-'       + notify_id);
            const email  = document.getElementById('email-'       + notify_id);
            const active = document.getElementById('active-'      + notify_id);
            const meter  = document.getElementById('meter-'       + notify_id);

            if (!select || !value || !token || !email) {
                console.error('Element not found for ID:', notify_id); return;
            }
            formdata.append('meter_id', meter.value);
            formdata.append('name',     name.value);
            formdata.append('mark',     select.value);
            formdata.append('value',    value.value);
            formdata.append('token',    token.value);
            formdata.append('email',    email.value);
            formdata.append('active',   active.classList.contains('bg-blue') ? 1 : 0);
        }

        showLoading();
        try {
            const res  = await fetch('../config/update-notify.php', { method: 'POST', body: formdata });
            const data = await res.json();
            if (data.success) {
                notifies = await fetchnotify();
                loadDataMeter(meters[meter_id - 1]);
                showEmsModal('success', status === 'create' ? 'create' : 'update',
                    status === 'create' ? (_lang['notify_created_title'] || 'สร้างการแจ้งเตือนสำเร็จ')   : (_lang['notify_updated_title'] || 'อัพเดตการแจ้งเตือนสำเร็จ'),
                    status === 'create' ? (_lang['notify_created_desc']  || 'การแจ้งเตือนใหม่ถูกบันทึกในระบบแล้ว') : (_lang['notify_updated_desc']  || 'ข้อมูลการแจ้งเตือนถูกอัพเดตเรียบร้อยแล้ว'));
            } else {
                showEmsModal('error', 'error',
                    _lang['save_failed'] || 'ไม่สามารถบันทึกได้',
                    data.message || _lang['save_error_desc'] || 'เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองอีกครั้ง');
            }
        } catch(e) { showEmsModal('error', 'error', _lang['error'] || 'เกิดข้อผิดพลาด', e.message); }
        hideLoading();
    }

    document.getElementById("menu-config-1").addEventListener("click", function () {
        document.getElementById("menu-config-1").classList.add("active");
        document.getElementById("menu-config-2").classList.remove("active");
        loadDataMeter(selected_meter);
    });

    document.getElementById("menu-config-2").addEventListener("click", function () {
        document.getElementById("menu-config-2").classList.add("active");
        document.getElementById("menu-config-1").classList.remove("active");
        loadDataMeter(selected_meter);
    });

    async function updateMeter() {
        let formMeter = document.getElementById('meter-form');
        if (!formMeter) { console.error("Form element not found!"); return; }

        const btn = document.getElementById('btn-save-meter');
        const origHTML = btn ? btn.innerHTML : '';
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin .7s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> ${_lang['save']}...`;
            btn.style.opacity = '0.75';
        }
        if (!document.getElementById('ems-spin-style')) {
            const s = document.createElement('style');
            s.id = 'ems-spin-style';
            s.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
            document.head.appendChild(s);
        }

        showLoading();
        try {
            const res  = await fetch('../config/update-meter.php', { method: 'POST', body: new FormData(formMeter) });
            const data = await res.json();
            if (data.success) {
                showEmsModal('success', 'save',
                    _lang['save_success']      || 'บันทึกข้อมูลสำเร็จ',
                    _lang['save_success_desc'] || 'ข้อมูล Meter ถูกบันทึกในระบบเรียบร้อยแล้ว');
                setTimeout(() => process(), 2000);
            } else {
                showEmsModal('error', 'error',
                    _lang['save_failed']      || 'บันทึกไม่สำเร็จ',
                    data.message || _lang['save_failed_desc'] || 'เกิดข้อผิดพลาด กรุณาลองอีกครั้ง');
            }
        } catch(e) {
            console.error(e);
            showEmsModal('error', 'error',
                _lang['save_failed']    || 'บันทึกไม่สำเร็จ',
                _lang['network_error']  || 'เกิดข้อผิดพลาดที่ไม่คาดคิด กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่อีกครั้ง');
        } finally {
            hideLoading();
            if (btn) { btn.disabled = false; btn.innerHTML = origHTML; btn.style.opacity = '1'; }
        }
    }

    function addNotify() {
        let listNotify = document.getElementById('list-notify');
        if (!listNotify) { return }
        let blankdiv = document.getElementById('blankdiv');
        const meterID = blankdiv.querySelector('#meterID').value;
        let div = document.createElement('div');
        div.className = 'noti-card';
        div.innerHTML = `
            <div class="noti-card__head">
                <svg class="noti-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                <span class="noti-card__title">${_lang['nnotify']}</span>
            </div>
            <div class="noti-card__body">
                <input id="meter-0" type="hidden" value="${meterID}"/>

                <label class="noti-label">${_lang['name']}</label>
                <input id="name-0" class="noti-input" type="text" placeholder="${_lang['name']}">

                <label class="noti-label">${_lang['sign']}</label>
                <div class="noti-cond">
                    <select id="select-mark-0" class="noti-input">
                        <option value="<">${_lang['<']} (&lt;)</option>
                        <option value=">">${_lang['>']} (&gt;)</option>
                        <option value="=">${_lang['=']} (=)</option>
                    </select>
                    <input id="value-0" class="noti-input" type="number" placeholder="${_lang['value']}">
                </div>

                <label class="noti-label">${_lang['token']} ${_lang['line']}</label>
                <input id="token-0" class="noti-input" type="text" placeholder="Line token">

                <label class="noti-label">${_lang['email']}</label>
                <input id="email-0" class="noti-input" type="text" placeholder="email">

                <div class="noti-actions">
                    <input id="active-0" value="${_lang['enabled']}" class="noti-btn bg-blue" readonly>
                    <input id="update-0" value="${_lang['save']}" onclick="UpdateStatusNotify(${meterID},0,'create')" class="noti-btn bg-green" readonly>
                </div>
            </div>
        `;
        blankdiv.remove();
        listNotify.appendChild(div);
    }

    function deleteNotify(mid, id) {
        showEmsConfirm(
            _lang['confirm_delete_title'] || 'คุณต้องการลบการแจ้งเตือนนี้?',
            _lang['confirm_delete_desc']  || 'การดำเนินการนี้ไม่สามารถย้อนกลับได้',
            async () => {
                showLoading();
                try {
                    let formdata = new FormData();
                    formdata.append('id', id);
                    formdata.append('status', 'delete');
                    const res  = await fetch('../config/update-notify.php', { method: 'POST', body: formdata });
                    const data = await res.json();
                    if (data.success) {
                        notifies = await fetchnotify();
                        loadDataMeter(meters[mid - 1]);
                        showEmsModal('success', 'delete',
                            _lang['delete_success']      || 'ลบการแจ้งเตือนสำเร็จ',
                            _lang['delete_success_desc'] || 'การแจ้งเตือนถูกลบออกจากระบบเรียบร้อยแล้ว');
                    } else {
                        showEmsModal('error', 'error',
                            _lang['delete_failed']      || 'ลบไม่สำเร็จ',
                            data.message || _lang['delete_error_desc'] || 'เกิดข้อผิดพลาดในการลบข้อมูล');
                    }
                } catch(e) {
                    showEmsModal('error', 'error', _lang['error'] || 'เกิดข้อผิดพลาด', e.message);
                }
                hideLoading();
            }
        );
    }
</script>
