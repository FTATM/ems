<script>
  let meters = [];
  let types = [];
  let locations = [];
  let groups = [];
  let filtermeters = [];
  let boxMeshes = {};
  let refreshIntervalId; // เก็บ interval id
  let firstLoading = true;
  let setShowMeter = 0;
  const GAUGE_ARC_LEN = 263.9; // ความยาว arc ครึ่งวง r=84 (π·84)

  const model_name = "Q";
  const typeMeterID = "<?=$_SESSION['tid'] ?? 0;?>";
  const groupID = "<?=$_SESSION['gid'] ?? 0;?>";

  document.addEventListener("DOMContentLoaded", async () => {
    await processData();
  });

  async function processData() {
    await process();
    await setRefreshTime();
    if (filtermeters.length > 0) {
      await loadMeter(filtermeters[0].id);
    } else {
      console.warn('[MAP] filtermeters is empty — no meters to display');
      document.getElementById('name-meter').textContent = 'ไม่พบมิเตอร์';
    }
  }

  async function fetchAll() {
    try {
      // realtime endpoint คืนมิเตอร์ (กรอง gid+tid ฝั่ง server) พร้อม data = [{type_id,value,create_date}, ...]
      const realtime = await fetchRealtimeOfMeters(typeMeterID, groupID);
      meters = (realtime && typeof realtime === 'object') ? Object.values(realtime) : [];
      console.log('[MAP] meters(realtime):', meters.length, meters);
    } catch (e) { console.error('[MAP] fetch realtime error:', e); meters = []; }

    try {
      let responsetype = await fetch("../config/fetch-data_type.php");
      let jsontype = await responsetype.json();
      types = jsontype.data ?? [];
    } catch (e) { types = []; }

    try {
      let responseLocation = await fetch("../config/fetch-locations.php");
      let jsonLocation = await responseLocation.json();
      locations = jsonLocation.data ?? [];
    } catch (e) { locations = []; }

    try {
      let responsegroup = await fetch("../config/fetch-groups.php");
      let jsongroup = await responsegroup.json();
      groups = jsongroup.data ?? [];
    } catch (e) { groups = []; }
  }

  async function process() {
    await fetchAll();
    await filterData();
    await generateListGroups();
  }

  // ค่าล่าสุดของ data_type หนึ่ง ๆ จาก meter.data (array ของ {type_id,value,create_date})
  function latestValue(meter, typeId) {
    const rows = (meter && Array.isArray(meter.data)) ? meter.data : [];
    const hit = rows.find(d => String(d.type_id) === String(typeId));
    return (hit && hit.value != null && hit.value !== '') ? hit.value : 0;
  }

  function filterData() {
    const all = Array.isArray(meters) ? meters : Object.values(meters);
    if (groupID && groupID !== "0") {
      filtermeters = all.filter((m) => String(m.group_id) === String(groupID) && String(m.meter_type_id) === String(typeMeterID));
      // fallback: ถ้า filter แล้วว่าง ให้แสดงทั้งหมด
      if (filtermeters.length === 0) filtermeters = all;
    } else {
      filtermeters = all;
    }
    console.log('[MAP] filtermeters:', filtermeters.length, 'groupID:', groupID, 'typeMeterID:', typeMeterID);
  }

  function addHotspot(modelViewer, meter, slot, position, normal, label) {
    const btn = document.createElement("button");
    btn.className = "hotspot";
    btn.id = "btn3d-meter-" + meter.id;
    btn.style.display = 'none';
    btn.setAttribute("slot", slot);
    btn.setAttribute("data-position", position);
    btn.setAttribute("data-normal", normal);
    btn.textContent = label;
    btn.onclick = () => showValueOnView(meter.id);
    // onClickTemplate(btn, meter);
    modelViewer.appendChild(btn);
  }

  function onClickTemplate(parent, meter) {
    let MeterValue = {
      "VoltageA": latestValue(meter, 7),
      "VoltageB": latestValue(meter, 8),
      "VoltageC": latestValue(meter, 9),
      "CurrentA": latestValue(meter, 10),
      "CurrentB": latestValue(meter, 11),
      "CurrentC": latestValue(meter, 12),
      "Pf": latestValue(meter, 17),
      "frequency": latestValue(meter, 18),
    };
    parent.onclick = () => {
      let info = document.getElementById('infomation-meter');
      info.style.display = "flex";
      info.innerHTML = `
        <div class="text-end position-absolute" style="top:0px; right:5px;"><i class="bi bi-x" onclick="document.getElementById('infomation-meter').style.display='none';"></i></div>
        <h5 class="w-100 text-center">${meter.name}</h5>
        <div class="w-100 d-flex gap-2">
            <div class="flex-fill">
                <h6 class="m-0">V_A</h6>
                <input type="text" value="${MeterValue['VoltageA']}" class="bg-secondary bg-opacity-25" style="width:50px; font-size:0.75rem;" readonly>
            </div>
            <div class="flex-fill">
                <h6 class="m-0">V_B</h6>
                <input type="text" value="${MeterValue['VoltageB']}" class="bg-secondary bg-opacity-25" style="width:50px; font-size:0.75rem;" readonly>
            </div>
            <div class="flex-fill">
                <h6 class="m-0">V_C</h6>
                <input type="text" value="${MeterValue['VoltageC']}" class="bg-secondary bg-opacity-25" style="width:50px; font-size:0.75rem;" readonly>
            </div>
        </div>
        <div class="w-100 d-flex gap-2">
            <div class="flex-fill">
                <h6 class="m-0">C_A</h6>
                <input type="text" value="${MeterValue['CurrentA']}" class="bg-secondary bg-opacity-25" style="width:50px; font-size:0.75rem;" readonly>
            </div>
            <div class="flex-fill">
                <h6 class="m-0">C_B</h6>
                <input type="text" value="${MeterValue['CurrentB']}" class="bg-secondary bg-opacity-25" style="width:50px; font-size:0.75rem;" readonly>
            </div>
            <div class="flex-fill">
                <h6 class="m-0">C_C</h6>
                <input type="text" value="${MeterValue['CurrentC']}" class="bg-secondary bg-opacity-25" style="width:50px; font-size:0.75rem;" readonly>
            </div>
        </div>
        <div class="w-100">
            <h6 class="ps-2 m-0">Pf</h6>
            <input type="text" value="${MeterValue['Pf']}" class="w-100 bg-secondary bg-opacity-25" style="font-size:0.75rem;" readonly>
        </div>
        <div class="w-100">
            <h6 class="ps-2 m-0">Frequency</h6>
            <input type="text" value="${MeterValue['frequency']}" class="w-100 bg-secondary bg-opacity-25" style="font-size:0.75rem;" readonly>
        </div>
        <input class="w-100 btn border btn-sm" value="close" onclick="document.getElementById('infomation-meter').style.display='none';">
      `;
    };
  }

  function deleteHotspot(modelViewer, slot) {
    const hotspot = modelViewer.querySelector(`[slot="${slot}"]`);
    if (hotspot) {
      modelViewer.removeChild(hotspot);
    }
  }

  function generateListGroups() {
    const list = document.getElementById("listgroup");
    if (!list) return;

    // reset panel styling
    list.style.cssText = "";

    list.innerHTML = `
      <div class="listgroup-header">
        <span class="listgroup-header__title">รายชื่อมิเตอร์ทั้งหมด</span>
        <span class="listgroup-header__badge">${filtermeters.length} รายการ</span>
      </div>
      <div class="listgroup-items" id="listgroup-items"></div>
    `;

    const container = document.getElementById("listgroup-items");

    filtermeters.forEach((m) => {
      const div = document.createElement("div");
      div.className = "meter-list-item" + (setShowMeter === m.id ? " active" : "");
      div.id = "listitem-" + m.id;
      div.innerHTML = `<span class="meter-list-item__icon"></span>
        <span class="meter-list-item__name">${m.name}</span>`;
      div.onclick = () => { setActiveMeterItem(m.id); showValueOnView(m.id); };
      div.onmouseover = () => showBtn3DMeter(m.id);
      div.onmouseleave = () => hideBtn3DMeter(m.id);
      container.appendChild(div);
    });
  }


  function setActiveMeterItem(id) {
    document.querySelectorAll('.meter-list-item').forEach(el => el.classList.remove('active'));
    const target = document.getElementById('listitem-' + id);
    if (target) target.classList.add('active');
  }

  function loadMeter(id) {
    const modelViewer = document.getElementById("myModel");
    modelViewer.src = "../assets/" + model_name + ".glb";

    // let imageViewer = document.getElementById('3d-viewer');
    // imageViewer.innerHTML = `
    //   <img src="../assets/images/map.png" alt="My PNG" style="width: 100%; height: auto;">
    // `;

    filtermeters.flatMap(m => {
      deleteHotspot(modelViewer, "hotspot-" + m.id);
      firstLoading = false;
      addHotspot(modelViewer, m, "hotspot-" + m.id, `${m.x}m ${m.y}m ${m.z}m`, "0m 1m 0m", m.name);
      // let div = document.createElement('div');
      // div.className = "point";
      // imageViewer.innerHTML += `<div class="point" style="Left:${m.x}px; top:${m.z}px;" onclick="loadMeter(${m.id})">${m.id}</div>`;
      // Object.values(meters).forEach(meter => {
      // });

    });
    showValueOnView(id);
  }

  function setRefreshTime() {
    const inputRefresh = document.getElementById('input-refresh');
    const refreshTime = parseInt(inputRefresh.value, 10);
    if (isNaN(refreshTime) || refreshTime < 1 || refreshTime > 60) {
      alertMessages('error', 'Error', 'Please enter a valid refresh time between 1 and 30 seconds.');
      return;
    }
    // เคลียร์ interval เก่า
    clearInterval(refreshIntervalId);

    console.log("Setting refresh time to:", refreshTime);

    // ตั้ง interval ใหม่
    refreshIntervalId = setInterval(async () => {
      await process();
      // อัปเดต panel ซ้ายของมิเตอร์ที่เลือกอยู่ด้วยค่าล่าสุด
      if (setShowMeter && filtermeters.some(m => String(m.id) === String(setShowMeter))) {
        showValueOnView(setShowMeter);
      }
    }, refreshTime * 1000);
  }

  function showValueOnView(id) {
    setBtn3DMeter(id);
    hideAllBtn3DMeter();
    showBtn3DMeter(id);
    setActiveMeterItem(id);

    const meter = filtermeters.find(m => String(m.id) === String(id));
    if (!meter) { console.warn('[MAP] meter not found:', id); return; }

    document.getElementById('name-meter').textContent = meter.name;

    const idsAndValues = {
      "VoltageA": latestValue(meter, 7),
      "VoltageB": latestValue(meter, 8),
      "VoltageC": latestValue(meter, 9),
      "CurrentA": latestValue(meter, 10),
      "CurrentB": latestValue(meter, 11),
      "CurrentC": latestValue(meter, 12),
      "Pf": latestValue(meter, 17),
      "frequency": latestValue(meter, 18),
    };
    Object.entries(idsAndValues).forEach(([key, value]) => {
      const element = document.getElementById(key);
      if (element) element.value = value;
    });

    updateGauge(latestValue(meter, 1));
  }

  function showBtn3DMeter(mid) {
    const btn = document.getElementById("btn3d-meter-" + mid);
    if (btn) btn.style.display = 'block';
  }

  function hideBtn3DMeter(mid) {
    if (mid === setShowMeter) return;
    const btn = document.getElementById("btn3d-meter-" + mid);
    if (btn) btn.style.display = 'none';
  }

  function hideAllBtn3DMeter() {
    Object.values(filtermeters).forEach(m => {
      hideBtn3DMeter(m.id);
    });
  }

  function setBtn3DMeter(id) {
    setShowMeter = id;
  }

  // สเกลสูงสุดแบบปัดขึ้นเลขกลม เผื่อหัวประมาณ 25%
  function niceMax(v) {
    if (!(v > 0)) return 10;
    const target = v * 1.25;
    const mag = Math.pow(10, Math.floor(Math.log10(target)));
    const n = target / mag; // 1..10
    const steps = [1, 1.5, 2, 3, 5, 7.5, 10];
    const step = steps.find(s => n <= s + 1e-9) || 10;
    return step * mag;
  }

  function fmtKw(n) {
    return (Math.round(n * 100) / 100).toLocaleString('en-US');
  }

  function updateGauge(v) {
    const val = parseFloat(v) || 0;
    const max = niceMax(val);
    const pct = max > 0 ? Math.min(1, Math.max(0, val / max)) : 0;

    const arc = document.getElementById('gauge-arc');
    const valEl = document.getElementById('gauge-value');
    const maxEl = document.getElementById('gauge-max');
    if (arc) arc.style.strokeDashoffset = String(GAUGE_ARC_LEN * (1 - pct));
    if (valEl) valEl.textContent = fmtKw(val);
    if (maxEl) maxEl.textContent = fmtKw(max);
  }
</script>
