<script>
    let meters = [];
    let meterWithData = [];
    let types = [];
    let locations = [];
    let groups = [];
    let refreshIntervalId;
    const gaugeInstances = {};

    let MeterID = 0;
    const typeMeterID = "<?=$_SESSION['tid'];?>";
    const groupID = "<?=$_SESSION['gid'];?>";

    document.addEventListener("DOMContentLoaded", async () => {
        showGridSkeleton();
        await fetchAll();
        generateOption('select-meters', Object.values(meters), true);
        setMeterID();
        renderHero();
        await generateGauge();               // innerHTML='' clears the skeleton tiles
        await process();
        setRefreshTime();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) clearInterval(refreshIntervalId);
            else setRefreshTime();
        });
    });

    async function process() {
        meterWithData = await fetchRealtimeOfMeters(typeMeterID, groupID, minutesFromSelect());
        updateDataInGauge();
        renderHeroUpdated();
        setRefreshTime();
    }

    // "1" = now/live -> 0 (endpoint returns the single latest row per type)
    // "0" = all time -> very large window
    // else -> that many minutes back
    function minutesFromSelect() {
        const v = document.getElementById('select-filter-value')?.value ?? '1';
        if (v === '1') return 0;
        if (v === '0') return 525600 * 20;
        return parseInt(v, 10) || 0;
    }

    async function fetchAll() {
        let responsetype = await fetch("../config/fetch-data_type.php");
        let jsontype = await responsetype.json();
        types = jsontype.data;

        let responseLocation = await fetch("../config/fetch-locations.php");
        let jsonLocation = await responseLocation.json();
        locations = jsonLocation.data;

        let responsegroup = await fetch("../config/fetch-groups.php");
        let jsongroup = await responsegroup.json();
        groups = jsongroup.data;

        meters = await fetchMeters(typeMeterID, groupID);
    }

    async function generateGauge() {
        const listGauge = document.getElementById('list-gauge');
        listGauge.innerHTML = '';

        Object.values(types).forEach((t) => {
            let card = document.createElement('div');
            card.className = 'gauge-card';
            card.dataset.typeId = t.id;

            let titleEl = document.createElement('div');
            titleEl.className = 'gauge-card__title';
            titleEl.textContent = t.name;
            card.appendChild(titleEl);

            let canvas = document.createElement('canvas');
            canvas.id = 'gauge_' + t.id;
            card.appendChild(canvas);

            let valueEl = document.createElement('div');
            valueEl.className = 'gauge-card__value';
            valueEl.dataset.typeId = t.id;
            valueEl.textContent = '0.00';
            card.appendChild(valueEl);

            listGauge.appendChild(card);

            const max = parseInt(t.maxvaluecolumn);
            gaugeGenerate('gauge_' + t.id, t.name, t.name, 0, 0, max * 1.2 || 200, 5);
        });

        await generateDataList();
        updateGaugeCount();
    }

    async function generateDataList() {
        const sidebarBody = document.getElementById('sidebar-body');
        if (!sidebarBody) return;
        sidebarBody.innerHTML = '';

        // type key ที่ meter ปัจจุบันมีข้อมูลจริง (หรือทั้งหมดถ้าว่าง)
        const selectedMeter = Object.values(meterWithData).find(m => m.id === parseInt(MeterID));
        const activeKeys = selectedMeter ? Object.keys(selectedMeter.data) : [];

        const showTypes = activeKeys.length > 0
            ? activeKeys.map(k => types.find(t => String(t.id) === String(k))).filter(Boolean)
            : types;

        showTypes.forEach($row => {
            let rowDiv = document.createElement('div');
            rowDiv.className = 'gauge-data-row';

            let label = document.createElement('span');
            label.className = 'gauge-data-label';
            label.textContent = $row.name;

            let input = document.createElement('input');
            input.id = 'type-' + $row.id;
            input.className = 'gauge-data-value';
            input.value = '0.00';
            input.readOnly = true;
            input.tabIndex = -1;

            rowDiv.appendChild(label);
            rowDiv.appendChild(input);
            sidebarBody.appendChild(rowDiv);
        });
    }

    function updateDataInGauge() {
        const selectedMeter = meterWithData[MeterID];
        if (!selectedMeter || !selectedMeter.data) {
            document.querySelectorAll('.gauge-card').forEach(c => c.classList.add('is-stale'));
            setHeroStatus(false);
            return;
        }

        const seen = new Set();
        Object.values(selectedMeter.data).forEach((row) => {
            const id = String(row.type_id);
            if (seen.has(id)) return;          // first row per type = most recent (DESC)
            seen.add(id);
            const val = parseFloat(row?.value) || 0;

            const inp = document.getElementById('type-' + id);                     // sidebar input
            if (inp) inp.value = val.toFixed(2);
            const tv = document.querySelector('.gauge-card__value[data-type-id="' + id + '"]'); // tile readout
            if (tv) tv.textContent = val.toFixed(2);

            const typeObj = types.find(t => String(t.id) === id);
            if (typeObj) gaugeGenerate('gauge_' + typeObj.id, typeObj.name, typeObj.name, val);
        });

        document.querySelectorAll('.gauge-card').forEach(card => {
            card.classList.toggle('is-stale', !seen.has(String(card.dataset.typeId)));
        });
        setHeroStatus(seen.size > 0);
    }

    // ── Theme-aware gauge palette (read from the --ems-* tokens at draw time) ──
    function gaugeTheme() {
        const cs = getComputedStyle(document.documentElement);
        const v = n => cs.getPropertyValue(n).trim();
        return {
            tick:   v('--ems-text-secondary') || v('--ems-muted'),
            minor:  v('--ems-border'),
            number: v('--ems-text-secondary') || v('--ems-text'),
            needle: v('--ems-text'),
            hub:    v('--ems-accent'),
            border: v('--ems-border'),
            danger: v('--ems-danger'),
            plate:  'rgba(0,0,0,0)',
        };
    }

    function gaugeGenerate(id, title, unitname, value = 0, minValue = 0, maxValue = 200, step = 5, width = 170, height = 170) {
        if (!id || !unitname) {
            console.error(`ID:${id} or unitname:${unitname} are required for gauge generation.`);
            return;
        }

        if (gaugeInstances[id]) {
            gaugeInstances[id].value = value;
            return;
        }

        const T = gaugeTheme();

        let majorTicks = [];
        for (let i = minValue; i <= maxValue; i += maxValue / step) {
            majorTicks.push(parseFloat(i).toFixed(1).toString());
        }

        // Option B (not used): make tiles fluid via a debounced ResizeObserver
        // calling gaugeInstances[id].update({ width, height }) on the tile.
        gaugeInstances[id] = new RadialGauge({
            renderTo: id,
            title: '',
            width: width,
            height: height,
            minValue: minValue,
            maxValue: maxValue,
            majorTicks: majorTicks,
            minorTicks: 2,
            highlights: [
                { from: maxValue * 0.67, to: maxValue, color: T.danger }
            ],
            value: value,
            valueBox: false,
            animationDuration: 900,
            animationRule: "linear",
            colorPlate: T.plate,
            colorMajorTicks: T.tick,
            colorMinorTicks: T.minor,
            colorTitle: T.tick,
            colorUnits: T.tick,
            colorNumbers: T.number,
            colorNeedle: T.needle,
            colorNeedleEnd: T.needle,
            needleWidth: 2,
            needleCircleSize: 5,
            colorNeedleCircleOuter: T.hub,
            colorNeedleCircleInnerEnd: T.border,
            colorBorderOuter: T.border,
            colorBorderOuterEnd: T.border,
            colorBorderMiddle: T.border,
            colorBorderMiddleEnd: T.border,
            colorBorderInner: T.border,
            colorBorderInnerEnd: T.border,
            fontNumbersSize: 16,
        }).draw();
    }

    /* ── Rebuild every gauge when the theme changes (fresh gaugeTheme() colours) ── */
    function reRenderAllGauges() {
        Object.keys(gaugeInstances).forEach(id => {
            try { gaugeInstances[id].destroy(); } catch (e) { }
            delete gaugeInstances[id];
        });
        generateGauge();          // rebuilds tiles + instances
        updateDataInGauge();      // re-applies values from cached meterWithData
    }

    /* ── MutationObserver: <html> class flips (server writes class="dark") ── */
    (function () {
        let raf = 0;
        const observer = new MutationObserver(() => {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(reRenderAllGauges);
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    })();

    function setRefreshTime() {
        const inputRefresh = document.getElementById('input-refresh');
        const refreshTime = parseInt(inputRefresh.value, 10);
        if (isNaN(refreshTime) || refreshTime < 1 || refreshTime > 60) {
            alertMessages('error', 'Error', 'Please enter a valid refresh time between 1 and 60 seconds.');
            return;
        }
        clearInterval(refreshIntervalId);
        refreshIntervalId = setInterval(() => {
            process();
        }, refreshTime * 1000);
    }

    /* ── UI helpers ── */
    function onMeterChange() {
        setMeterID();
        renderHero();
        if (!meterWithData || !Object.keys(meterWithData).length) { process(); return; }
        generateDataList();               // resync the sidebar rows to this meter
        updateDataInGauge();
        renderHeroUpdated();
    }

    function onTimeChange() {
        process();                        // re-fetch with the new window
    }

    function renderHero() {
        const sel = document.getElementById('select-meters');
        const name = sel && sel.selectedIndex > 0 ? sel.options[sel.selectedIndex].text : '—';
        setText('gauge-hero-meter', name);
        setText('gauge-hero-loc', getNameLocation(groupID));
        setText('gauge-hero-grp', getNameGroup(groupID));
    }

    function renderHeroUpdated() {
        const sm = meterWithData && meterWithData[MeterID];
        let latest = 0;
        if (sm && sm.data) {
            Object.values(sm.data).forEach(r => {
                const t = new Date(String(r.create_date).replace(/\//g, '-').replace(' ', 'T')).getTime();
                if (t > latest) latest = t;
            });
        }
        setText('gauge-hero-updated', latest ? formatDateTime(new Date(latest)) : '—');
        const ms = (parseInt(document.getElementById('input-refresh').value, 10) || 15) * 1000;
        setHeroStatus(latest > 0 && (Date.now() - latest) < Math.max(ms * 3, 120000));
    }

    function setHeroStatus(online) {
        const pill = document.getElementById('gauge-hero-status');
        if (!pill) return;
        pill.classList.toggle('is-stale', !online);
        pill.classList.toggle('ems-pill--muted', !online);
        setText('gauge-hero-status-text', online ? LANG.livefeed : LANG.offline);
    }

    function updateGaugeCount() {
        setText('gauge-count', document.querySelectorAll('.gauge-card').length);
    }

    function showGridSkeleton() {
        const g = document.getElementById('list-gauge');
        if (!g) return;
        g.innerHTML = Array.from({ length: 8 }).map(() => `
            <div class="gauge-skel-tile">
              <div class="ems-skeleton ems-skeleton--line" style="width:55%"></div>
              <div class="ems-skeleton gauge-skel-tile__disc"></div>
              <div class="ems-skeleton ems-skeleton--line" style="width:40%"></div>
            </div>`).join('');
    }

    function setText(id, v) {
        const el = document.getElementById(id);
        if (el) el.textContent = v;
    }
</script>
