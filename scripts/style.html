<style>
    /* =====================================================================
       EMS "Aurora" DESIGN TOKENS  —  global, loaded on every page.
       Change a brand colour here and it propagates through the shared
       chrome (sidemenu, header, footer) and every rule below that uses
       var(--ems-*). Per-page stylesheets can opt in the same way.
       ===================================================================== */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

    :root {
        /* brand */
        --ems-accent:        #2563EB;   /* blue — primary actions, active nav */
        --ems-accent-strong: #1D4ED8;
        --ems-accent-bright: #3B82F6;
        --ems-accent-soft:   rgba(37, 99, 235,0.12);
        --ems-accent-glow:   rgba(37, 99, 235,0.28);
        --ems-accent-2:      #F59E0B;   /* amber — warnings, secondary accent   */
        --ems-danger:        #E11D48;
        --ems-success:       #16A34A;

        /* surfaces (light) */
        --ems-bg:        #EEF2F6;
        --ems-surface:   #FFFFFF;
        --ems-elevated:  #F7FAFC;
        --ems-border:    #D9E0E7;
        --ems-text:      #0F172A;
        --ems-muted:     #586472;

        --ems-text-secondary: #3D4F6B;   /* body/label text, between text and muted */
        --ems-accent-border:  rgba(37, 99, 235, 0.40);

        /* shape & depth */
        --ems-radius-sm:   10px;
        --ems-radius:      14px;
        --ems-radius-lg:   20px;
        --ems-radius-pill: 999px;
        --ems-shadow:    0 1px 3px rgba(15,23,42,0.08), 0 10px 30px rgba(15,23,42,0.06);
        --ems-shadow-lg: 0 12px 40px rgba(15,23,42,0.14);
        --ems-ring:      0 0 0 3px var(--ems-accent-soft);
        --ems-dur:       0.2s;
        --ems-font:      'Inter', 'Noto Sans Thai', 'Sarabun', system-ui, sans-serif;

        /* spacing scale — 4 · 8 · 12 · 16 · 24 · 32 */
        --ems-space-1: 4px;
        --ems-space-2: 8px;
        --ems-space-3: 12px;
        --ems-space-4: 16px;
        --ems-space-5: 24px;
        --ems-space-6: 32px;

        /* layout widths — app shell + side panels */
        --ems-rail-w:          64px;
        --ems-rail-expanded-w: 340px;
        --ems-panel-w-sm:      240px;
        --ems-panel-w:         280px;
        --ems-panel-w-lg:      320px;
        --ems-header-h:        60px;

        /* responsive breakpoint convention (Bootstrap): 768 / 992 / 1200 */
    }

    html.dark {

        --ems-accent-2:      #FBBF24;
        --ems-text-secondary: #9FB2C9;
        --ems-accent-border:  rgba(96, 165, 250, 0.35);

        --ems-bg:        #0B0F14;
        --ems-surface:   #141A21;
        --ems-elevated:  #1C242E;
        --ems-border:    #2A3542;
        --ems-text:      #E6EDF3;

        border-top: 8px solid var(--ems-accent);
        border-radius: 50%;

        height: 60px;
        animation: spin 1s linear infinite;
    }

    .stop-line {
        width: 50%;
        height: 5px;
        margin: 10px auto;
        border-radius: 5px;

        background: linear-gradient(90deg,
                gray 0%,
                gray 60%,
                white 60%,
                white 70%,
                red 70%,
                red 80%,
                white 80%,
                white 90%,
                gray 90%,
                gray 100%);
        background-size: 200% 100%;
    }

    .moving-line {
        width: 50%;
        height: 5px;
        margin: 10px auto;
        border-radius: 5px;

        background: linear-gradient(90deg,
                gray 0%,
                gray 60%,
                white 60%,
                white 70%,
                red 70%,
                red 80%,
                white 80%,
                white 90%,
                gray 90%,
                gray 100%);
        background-size: 200% auto;
        animation: moveColors 2s linear infinite;
    }

    @keyframes moveColors {
        0% {
            background-position: 100% 0%;
        }

        100% {
            background-position: -100% 0%;
        }
    }
