<script>
    // ════════════════════════════════════════════════════
    //  EMS – Phasor / Voltage Integrated Gauge
    // ════════════════════════════════════════════════════

    let meters = [];
    let types = [];
    let refreshIntervalId;
    let selectedMeterData = [];

    let MeterID = 0;
    const typeMeterID = "<?=$_SESSION['tid'];?>";
    const groupID = "<?=$_SESSION['gid'];?>";

    // ── Phase definitions ──
    // `key` is the untranslated data_type.name used to resolve ids (resolvePhaseIds) —
    // must stay English. `label` is the translated display text.
    const PHASES = [
        { id: '7', key: 'Voltage A-N', label: `${LANG.voltage} A-N`, group: 'LN', color: '#ef4444', needleW: 3.5 },
        { id: '8', key: 'Voltage B-N', label: `${LANG.voltage} B-N`, group: 'LN', color: '#3b82f6', needleW: 3.5 },
        { id: '9', key: 'Voltage C-N', label: `${LANG.voltage} C-N`, group: 'LN', color: '#eab308', needleW: 3.5 },
        { id: '14', key: 'Voltage A-B', label: `${LANG.voltage} A-B`, group: 'LL', color: '#a855f7', needleW: 2.2 },
        { id: '15', key: 'Voltage B-C', label: `${LANG.voltage} B-C`, group: 'LL', color: '#ec4899', needleW: 2.2 },
        { id: '16', key: 'Voltage C-A', label: `${LANG.voltage} C-A`, group: 'LL', color: '#06b6d4', needleW: 2.2 },
    ];

    // ── Theme-aware gauge palette (read from the --ems-* tokens at draw time) ──
    function gaugeTheme() {
        const cs = getComputedStyle(document.documentElement);
        const v = n => cs.getPropertyValue(n).trim();
        return {
            track: v('--ems-border'),
            tickHi: v('--ems-text-secondary') || v('--ems-muted'),
            tickLo: v('--ems-border'),
            label: v('--ems-muted'),
            hubOut: v('--ems-elevated'),
            hubIn: v('--ems-muted'),
            zoneLN: v('--ems-accent'),
            zoneLL: v('--ems-accent-2'),
            danger: v('--ems-danger'),
            font: v('--ems-font') || 'Inter, sans-serif',
        };
    }

    const GAUGE_MIN = 0;
    const GAUGE_MAX = 500;
    const ARC_START = Math.PI * 0.75;
    const ARC_END = Math.PI * 2.25;

    let canvas_n, ctx_n, CX_n, CY_n, R_n;

    const phaseValues = {};
    const phaseMetrics = {};
    const phaseStale = {};
    PHASES.forEach(p => {
        phaseValues[p.id] = 0;
        phaseMetrics[p.id] = { voltage: 0, current: 0, pf: 0, kw: 0, kva: 0 };
        phaseStale[p.id] = false;
    });

    // ════════════════════════════════════════════════════
    //  INIT
    // ════════════════════════════════════════════════════
    let ftloaded = false;
    document.addEventListener("DOMContentLoaded", async () => {
        ftloaded = true;
        initCanvas();
        await fetchAll();
        generateOption('select-meters', Object.values(meters), true);
        setMeterID();

        buildLegend();
        buildMetricCards();
        drawGauge(canvas_n, ctx_n, CX_n, CY_n, R_n);
        await process();
        setRefreshTime();
        hideLoading();

        // redraw on rail resize/pin (no window resize event fires for that) and on theme toggle
        new ResizeObserver(scheduleRedraw).observe(document.querySelector('.phasor-hero__gauge'));
        new MutationObserver(scheduleRedraw)
            .observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

        // pause polling while the tab is hidden
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) clearInterval(refreshIntervalId);
            else setRefreshTime();
        });
    });

    function sizeCanvas(c) {
        const dpr = window.devicePixelRatio || 1;
        const rect = c.getBoundingClientRect();
        const S = Math.max(220, Math.floor(Math.min(rect.width, rect.height)));
        c.width = Math.round(S * dpr);
        c.height = Math.round(S * dpr);
        c._css = S;
        const ctx = c.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { ctx, CX: S / 2, CY: S / 2 + S * 0.045, R: S * 0.42 };
    }

    function initCanvas() {
        canvas_n = document.getElementById('big-gauge-canvas');
        const g = sizeCanvas(canvas_n);
        ctx_n = g.ctx; CX_n = g.CX; CY_n = g.CY; R_n = g.R;
    }

    function redrawGauge() {
        initCanvas();
        drawGauge(canvas_n, ctx_n, CX_n, CY_n, R_n);
    }
    let _raf = 0;
    function scheduleRedraw() {
        cancelAnimationFrame(_raf);
        _raf = requestAnimationFrame(redrawGauge);
    }

    // ════════════════════════════════════════════════════
    //  FETCH
    // ════════════════════════════════════════════════════
    async function fetchAll() {
        const res = await fetch("../config/fetch-data_type.php");
        const json = await res.json();
        types = json.data ?? [];
        // resolve phase id หลัง types พร้อม
        if (types && types.length) resolvePhaseIds();
        meters = await fetchMeters(typeMeterID, groupID);
    }

    // ════════════════════════════════════════════════════
    //  FILTER (meter / time-range select onchange)
    // ════════════════════════════════════════════════════
    let _busy = false;
    async function filterMeters() {
        if (_busy) return;
        _busy = true;
        try {
            setMeterID();
            await process();
        } finally {
            _busy = false;
        }
    }

    function minutesFromSelect() {
        const time = document.getElementById('select-time');
        if (!time || time.value === '-' || time.value === 'now') return 0;
        if (time.value === 'all') return 999999999; // effectively unbounded; the server caps row count
        return parseInt(time.value, 10) || 0;
    }

    // ════════════════════════════════════════════════════
    //  PROCESS / FILTER
    // ════════════════════════════════════════════════════
    async function process() {
        meters = await fetchRealtimeOfMeters(typeMeterID, groupID, minutesFromSelect());
        await filterDataAndTime();
    }

    async function filterDataAndTime() {
        const time = document.getElementById('select-time');
        if (!time || time.value === '-') return;

        const now = new Date();
        let selectedDateTime;
        if (time.value === "all") selectedDateTime = new Date(1970, 0, 1);
        else if (time.value === "now") selectedDateTime = new Date(now.getTime() - 1.5 * 60000);
        else selectedDateTime = new Date(now.getTime() - parseInt(time.value, 10) * 60000);

        const meterSelected = Object.values(meters).find(m => Number(m.id) === Number(MeterID));
        if (!meterSelected) {
            selectedMeterData = { data: [] };
            checkTimeChange();
            return;
        }

        const rows = Array.isArray(meterSelected.data)
            ? meterSelected.data
            : Object.values(meterSelected.data || {});

        selectedMeterData = {
            ...meterSelected,
            data: rows.filter(row => {
                const t = new Date(String(row.create_date).replace(/\//g, '-').replace(' ', 'T'));
                return !isNaN(t) && t >= selectedDateTime;
            })
        };
        checkTimeChange();
    }

    // ════════════════════════════════════════════════════
    //  RESOLVE TYPE IDs จาก types array (ไม่ hardcode)
    // ════════════════════════════════════════════════════
    function resolveTypeId(namePart) {
        if (!types || !types.length) return null;
        const t = types.find(t => t.name && t.name.toLowerCase().includes(namePart.toLowerCase()));
        return t ? String(t.id) : null;
    }

    function resolvePhaseIds() {
        // match each PHASES entry's untranslated `key` against data_type.name
        PHASES.forEach(ph => {
            const found = types.find(t => t.name && t.name.trim().toLowerCase() === ph.key.toLowerCase());
            if (found) {
                ph.id = String(found.id);
            }
        });

        // reset phaseValues/phaseMetrics ด้วย id ใหม่
        PHASES.forEach(p => {
            if (!phaseValues[p.id]) phaseValues[p.id] = 0;
            if (!phaseMetrics[p.id]) phaseMetrics[p.id] = { voltage: 0, current: 0, pf: 0, kw: 0, kva: 0 };
        });
    }

    // ════════════════════════════════════════════════════
    //  COMPUTE AVERAGES
    // ════════════════════════════════════════════════════
    function checkTimeChange() {
        if (!types || !types.length) return;

        // resolve id จาก types จริงๆ ก่อนคำนวณ
        resolvePhaseIds();

        // หา key ของ Current A/B/C, Pf, kW, kVA จาก types
        const idCurrentA = resolveTypeId('Current A');
        const idCurrentB = resolveTypeId('Current B');
        const idCurrentC = resolveTypeId('Current C');
        const idPf = resolveTypeId('Pf') || resolveTypeId('Power Factor');
        const idKw = resolveTypeId('kW');
        const idKva = resolveTypeId('kVA');

        // map phase → current key
        const phaseCurrentMap = {};
        const lnPhases = PHASES.filter(p => p.group === 'LN');
        if (lnPhases[0]) phaseCurrentMap[lnPhases[0].id] = idCurrentA;
        if (lnPhases[1]) phaseCurrentMap[lnPhases[1].id] = idCurrentB;
        if (lnPhases[2]) phaseCurrentMap[lnPhases[2].id] = idCurrentC;

        const rawData = selectedMeterData.data || [];

        // group ตาม type_id
        const groupedData = {};

        rawData.forEach(row => {
            const id = row.type_id;
            if (!groupedData[id]) {
                groupedData[id] = [];
            }
            groupedData[id].push(row);
        });


        PHASES.forEach(ph => {
            const values = groupedData?.[ph.id];

            if (!values || !values.length) {
                phaseValues[ph.id] = 0;
                phaseMetrics[ph.id] = { voltage: 0, current: 0, pf: 0, kw: 0, kva: 0 };
                phaseStale[ph.id] = true;
                return;
            }
            phaseStale[ph.id] = false;

            let sumV = 0;

            const currentKey = phaseCurrentMap[ph.id];

            values.forEach(row => {
                sumV += parseFloat(row.value) || 0;
            });

            // 👉 ดึงค่าล่าสุด
            const lastV = parseFloat(values[values.length - 1]?.value) || 0;

            const lastI = currentKey
                ? (parseFloat(groupedData?.[currentKey]?.slice(-1)[0]?.value) || 0)
                : 0;

            const lastPf = idPf
                ? (parseFloat(groupedData?.[idPf]?.slice(-1)[0]?.value) || 0)
                : 0;

            const lastKw = idKw
                ? (parseFloat(groupedData?.[idKw]?.slice(-1)[0]?.value) || 0)
                : 0;

            const lastKva = idKva
                ? (parseFloat(groupedData?.[idKva]?.slice(-1)[0]?.value) || 0)
                : 0;

            const n = values.length;

            phaseValues[ph.id] = sumV / n;

            phaseMetrics[ph.id] = {
                voltage: sumV / n,
                current: lastI,
                pf: lastPf,
                kw: lastKw,
                kva: lastKva
            };
        });
        updateUI();
    }

    // ════════════════════════════════════════════════════
    //  BUILD DOM  (ครั้งแรกครั้งเดียว)
    // ════════════════════════════════════════════════════
    function buildLegend() {
        const legend = document.getElementById('phase-legend');
        if (!legend) return;
        legend.innerHTML = '';

        ['LN', 'LL'].forEach(grp => {
            // group divider label
            const grpLabel = document.createElement('span');
            grpLabel.className = 'legend-group-label';
            grpLabel.textContent = grp === 'LN' ? LANG.phase_to_neutral : LANG.phase_to_phase;
            legend.appendChild(grpLabel);

            PHASES.filter(p => p.group === grp).forEach(ph => {
                const chip = document.createElement('div');
                chip.className = 'legend-chip' + (ph.group === 'LL' ? ' legend-chip--ll' : '');
                chip.style.color = ph.color;
                chip.innerHTML = `
                    <div class="legend-dot-sm" style="background:${ph.color};box-shadow:0 0 5px ${ph.color}40"></div>
                    <span class="legend-name">${ph.label}</span>
                    <span class="legend-val" id="lval-${ph.id}">0.0 V</span>
                `;
                legend.appendChild(chip);
            });
        });
    }

    function buildMetricCards() {
        const container = document.getElementById('metric-cards');
        if (!container) return;
        container.innerHTML = '';

        PHASES.forEach(ph => {
            const card = document.createElement('div');
            card.className = 'metric-card';
            card.id = 'card-' + ph.id;
            card.style.setProperty('--ph-color', ph.color);
            card.innerHTML = `
                <div class="metric-card-header">
                    <span class="metric-phase-label">
                        <span class="metric-phase-dot"></span>
                        ${ph.label}
                    </span>
                    <span class="metric-voltage-badge" id="badge-${ph.id}">0.0 V</span>
                </div>
                <div class="metric-divider"></div>
                <div class="metric-row-labels">
                    <span title="${LANG.voltage}">V</span><span title="${LANG.current}">A</span><span>Pf</span><span>kW</span><span>kVA</span>
                </div>
                <div class="metric-row-values">
                    <strong id="mv-${ph.id}">0.00</strong>
                    <strong id="mc-${ph.id}">0.00</strong>
                    <strong id="mp-${ph.id}">0.00</strong>
                    <strong id="mk-${ph.id}">0.00</strong>
                    <strong id="mka-${ph.id}">0.00</strong>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // ════════════════════════════════════════════════════
    //  UPDATE UI
    // ════════════════════════════════════════════════════
    function pulseEl(el) {
        if (!el) return;
        el.classList.remove('val-update');
        void el.offsetWidth;
        el.classList.add('val-update');
    }

    function updateUI() {
        // avg LN → centre display
        const lnPhases = PHASES.filter(p => p.group === 'LN');
        const avgLN = lnPhases.reduce((s, p) => s + (phaseValues[p.id] || 0), 0) / lnPhases.length;
        const avgEl = document.getElementById('avg-voltage-display');
        if (avgEl) { avgEl.textContent = avgLN.toFixed(1); pulseEl(avgEl); }

        PHASES.forEach(ph => {
            const v = phaseValues[ph.id] || 0;
            const m = phaseMetrics[ph.id];
            const stale = !!phaseStale[ph.id];

            // legend chip value
            const lv = document.getElementById('lval-' + ph.id);
            if (lv) { lv.textContent = v.toFixed(1) + ' V'; pulseEl(lv); }
            lv?.closest('.legend-chip')?.classList.toggle('is-stale', stale);

            // voltage badge
            const badge = document.getElementById('badge-' + ph.id);
            if (badge) badge.textContent = v.toFixed(1) + ' V';

            // metric values
            [['mv', 'voltage'], ['mc', 'current'], ['mp', 'pf'], ['mk', 'kw'], ['mka', 'kva']].forEach(([pref, key]) => {
                const el = document.getElementById(pref + '-' + ph.id);
                if (el) { el.textContent = (m[key] || 0).toFixed(2); pulseEl(el); }
            });

            document.getElementById('card-' + ph.id)?.classList.toggle('is-stale', stale);
        });

        drawGauge(canvas_n, ctx_n, CX_n, CY_n, R_n);
    }

    // ════════════════════════════════════════════════════
    //  DRAW GAUGE
    // ════════════════════════════════════════════════════
    function valToAngle(v) {
        return ARC_START + ((v - GAUGE_MIN) / (GAUGE_MAX - GAUGE_MIN)) * (ARC_END - ARC_START);
    }

    function drawGauge(canvas0, ctx0, CX0, CY0, R0) {
        if (!canvas0) return;
        const T = gaugeTheme();
        const k = R0 / 184.8;   // 184.8 = the original fixed 440×0.42 radius — scales every constant below

        ctx0.clearRect(0, 0, canvas0._css || canvas0.width, canvas0._css || canvas0.height);

        // ── background track ──
        ctx0.beginPath();
        ctx0.arc(CX0, CY0, R0, ARC_START, ARC_END);
        ctx0.strokeStyle = T.track;
        ctx0.lineWidth = 24 * k;
        ctx0.lineCap = 'round';
        ctx0.stroke();

        // ── L-N zone tint (0-300 V) ──
        ctx0.save();
        ctx0.globalAlpha = 0.10;
        ctx0.beginPath();
        ctx0.arc(CX0, CY0, R0, ARC_START, valToAngle(300));
        ctx0.strokeStyle = T.zoneLN;
        ctx0.lineWidth = 24 * k;
        ctx0.stroke();
        ctx0.restore();

        // ── L-L zone tint (300-500 V) ──
        ctx0.save();
        ctx0.globalAlpha = 0.10;
        ctx0.beginPath();
        ctx0.arc(CX0, CY0, R0, valToAngle(300), ARC_END);
        ctx0.strokeStyle = T.zoneLL;
        ctx0.lineWidth = 24 * k;
        ctx0.stroke();
        ctx0.restore();

        // ── danger zone (top 30%) ──
        ctx0.save();
        ctx0.globalAlpha = 0.10;
        ctx0.beginPath();
        ctx0.arc(CX0, CY0, R0, valToAngle(GAUGE_MAX * 0.70), ARC_END);
        ctx0.strokeStyle = T.danger;
        ctx0.lineWidth = 24 * k;
        ctx0.stroke();
        ctx0.restore();

        // ── zone labels ──
        [{ v: 150, text: 'L-N', color: T.zoneLN },
        { v: 400, text: 'L-L', color: T.zoneLL }].forEach(({ v, text, color }) => {
            const a = valToAngle(v), tr = R0 + 20 * k;
            ctx0.save();
            ctx0.globalAlpha = 0.6;
            ctx0.font = `700 ${11 * k}px ${T.font}`;
            ctx0.fillStyle = color;
            ctx0.textAlign = 'center';
            ctx0.textBaseline = 'middle';
            ctx0.fillText(text, CX0 + tr * Math.cos(a), CY0 + tr * Math.sin(a));
            ctx0.restore();
        });

        // ── ticks + labels ──
        for (let v = GAUGE_MIN; v <= GAUGE_MAX; v += 10) {
            const a = valToAngle(v);
            const isMajor = v % 50 === 0;
            const r0 = R0 - (isMajor ? 20 * k : 11 * k);
            ctx0.beginPath();
            ctx0.moveTo(CX0 + r0 * Math.cos(a), CY0 + r0 * Math.sin(a));
            ctx0.lineTo(CX0 + (R0 + 3 * k) * Math.cos(a), CY0 + (R0 + 3 * k) * Math.sin(a));
            ctx0.strokeStyle = isMajor ? T.tickHi : T.tickLo;
            ctx0.lineWidth = isMajor ? 2 * k : 1 * k;
            ctx0.stroke();

            if (isMajor) {
                const tr = R0 - 35 * k;
                ctx0.fillStyle = T.label;
                ctx0.font = `500 ${12 * k}px ${T.font}`;
                ctx0.textAlign = 'center';
                ctx0.textBaseline = 'middle';
                ctx0.fillText(v, CX0 + tr * Math.cos(a), CY0 + tr * Math.sin(a));
            }
        }

        // ── needles: LL (dashed) first, LN (solid) on top ──
        [...PHASES].sort((a, b) => a.group === 'LN' ? 1 : -1).forEach(ph => {
            if (phaseStale[ph.id]) return;   // no data in the selected range — skip the needle

            const v = phaseValues[ph.id] || 0;
            const angle = valToAngle(v);
            const needleLen = ph.group === 'LN' ? R0 - 6 * k : R0 - 24 * k;

            ctx0.save();
            ctx0.translate(CX0, CY0);
            ctx0.shadowColor = ph.color + '55';
            ctx0.shadowBlur = (ph.group === 'LN' ? 10 : 6) * k;

            ctx0.beginPath();
            ctx0.moveTo(0, 0);
            ctx0.lineTo(needleLen * Math.cos(angle), needleLen * Math.sin(angle));
            ctx0.strokeStyle = ph.color;
            ctx0.lineWidth = ph.needleW * k;
            ctx0.lineCap = 'round';
            if (ph.group === 'LL') ctx0.setLineDash([9 * k, 5 * k]);
            ctx0.stroke();
            ctx0.setLineDash([]);

            // tip marker — LN: filled dot, LL: hollow ring (family reads even without color)
            const tipR = (ph.group === 'LN' ? 4.5 : 3.5) * k;
            ctx0.beginPath();
            ctx0.arc(needleLen * Math.cos(angle), needleLen * Math.sin(angle), tipR, 0, Math.PI * 2);
            if (ph.group === 'LN') {
                ctx0.fillStyle = ph.color;
                ctx0.shadowBlur = 14 * k;
                ctx0.fill();
            } else {
                ctx0.strokeStyle = ph.color;
                ctx0.lineWidth = 2 * k;
                ctx0.shadowBlur = 14 * k;
                ctx0.stroke();
            }

            ctx0.restore();
        });

        // ── hub ──
        const grad = ctx0.createRadialGradient(CX0, CY0, 0, CX0, CY0, 15 * k);
        grad.addColorStop(0, T.hubOut);
        grad.addColorStop(1, T.hubIn);
        ctx0.beginPath();
        ctx0.arc(CX0, CY0, 15 * k, 0, Math.PI * 2);
        ctx0.fillStyle = grad;
        ctx0.shadowColor = 'rgba(0,0,0,0.28)';
        ctx0.shadowBlur = 12 * k;
        ctx0.fill();

        ctx0.shadowBlur = 0;
        ctx0.beginPath();
        ctx0.arc(CX0, CY0, 5.5 * k, 0, Math.PI * 2);
        ctx0.fillStyle = T.label;
        ctx0.fill();
    }

    // ════════════════════════════════════════════════════
    //  SET REFRESH
    // ════════════════════════════════════════════════════
    function setRefreshTime() {
        const inputRefresh = document.getElementById('input-refresh');
        const t = parseInt(inputRefresh.value, 10);
        if (isNaN(t) || t < 1 || t > 60) {
            alertMessages('error', 'Error', 'Please enter a valid refresh time between 1 and 60 seconds.');
            return;
        }
        clearInterval(refreshIntervalId);
        refreshIntervalId = setInterval(() => process(), t * 1000);
    }
</script>
